[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "skymark"
version = "1.0.0"
description = "Skymark Airlines flight history extractor for 確定申告"
requires-python = ">=3.10"

[project.scripts]
skymark = "skymark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
